<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Rounded White Square Card Background (Optional/Container) -->
  <!-- Main Owl Body -->
  <path d="M 60,40 C 75,45 85,50 100,50 C 115,50 125,45 140,40 C 155,50 162,65 162,80 C 175,95 178,115 172,130 C 168,140 160,148 152,150 C 142,168 122,175 100,175 C 78,175 58,168 48,150 C 40,148 32,140 28,130 C 22,115 25,95 38,80 C 38,65 45,50 60,40 Z" fill="#0F2547" />
  
  <!-- Left Foot / Claws -->
  <path d="M 72,173 Q 72,182 76,180 Q 80,182 84,180 Q 88,182 88,173" fill="none" stroke="#0F2547" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Right Foot / Claws -->
  <path d="M 112,173 Q 112,182 116,180 Q 120,182 124,180 Q 128,182 128,173" fill="none" stroke="#0F2547" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Large Owl Eyes (White Circles) -->
  <circle cx="74" cy="92" r="23" fill="#FFFFFF" />
  <circle cx="126" cy="92" r="23" fill="#FFFFFF" />
  
  <!-- Pupils (Navy Circles) -->
  <circle cx="74" cy="92" r="9.5" fill="#0F2547" />
  <circle cx="126" cy="92" r="9.5" fill="#0F2547" />
  
  <!-- Beak (Navy downward pointy triangle) -->
  <path d="M 94,92 Q 100,91 106,92 L 100,105 Z" fill="#0F2547" />
  
  <!-- Owl Belly (White curved region) -->
  <path d="M 60,135 C 60,121 140,121 140,135 C 140,154 125,165 100,165 C 75,165 60,154 60,135 Z" fill="#FFFFFF" />
  
  <!-- Belly Icons / Glyphs (Sleek Blue) -->
  <!-- 1. Map Pin -->
  <path d="M 74,139 C 72,139 70.5,140.5 70.5,142 C 70.5,144.5 74,148 74,148 C 74,148 77.5,144.5 77.5,142 C 77.5,140.5 76,139 74,139 Z" fill="#2563EB" />
  <circle cx="74" cy="142" r="1" fill="#FFFFFF" />
  
  <!-- 2. Speech Bubble with eyes -->
  <rect x="93.5" y="131" width="13" height="8.5" rx="4" fill="#2563EB" />
  <path d="M 98,139.5 L 100,142 L 102,139.5 Z" fill="#2563EB" />
  <circle cx="97" cy="135.2" r="0.8" fill="#FFFFFF" />
  <circle cx="103" cy="135.2" r="0.8" fill="#FFFFFF" />
  
  <!-- 3. Globe Grid -->
  <circle cx="124" cy="136.5" r="5.5" stroke="#2563EB" stroke-width="0.9" fill="none" />
  <ellipse cx="124" cy="136.5" rx="2.2" ry="5.5" stroke="#2563EB" stroke-width="0.8" fill="none" />
  <line x1="118.5" y1="136.5" x2="129.5" y2="136.5" stroke="#2563EB" stroke-width="0.8" />
  <line x1="124" y1="131" x2="124" y2="142" stroke="#2563EB" stroke-width="0.8" />
  
  <!-- 4. Smiling mouth curve -->
  <path d="M 94.5,148 Q 100,153 105.5,148" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" fill="none" />
  
  <!-- 5. Arrow pointing down-right -->
  <line x1="123" y1="143" x2="129" y2="149" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 126,149 L 129,149 L 129,146" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- 6. Left side angle bracket '<' -->
  <path d="M 87.5,138 L 84,142.5 L 87.5,147" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- 7. Dots and Pills -->
  <circle cx="116.5" cy="150" r="2.8" fill="#2563EB" />
  <rect x="80" y="150.5" width="6.5" height="2.2" rx="1.1" fill="#2563EB" />
  <rect x="73.5" y="132.5" width="6.5" height="2.2" rx="1.1" fill="#2563EB" />
  <circle cx="131.5" cy="134.5" r="1.1" fill="#2563EB" />
</svg>
